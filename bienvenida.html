<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenido a AceroJJ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        body, html {
            height: 100%;
            margin: 0;
            overflow: hidden;
        }
        .welcome-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            text-align: center;
            background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), url('https://images.pexels.com/photos/2219024/pexels-photo-2219024.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            color: white;
        }

        /* @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        } */

        .welcome-container h1 {
            font-size: 4.5rem;
            font-weight: 700;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.3);
            margin-bottom: 1rem;
        }
        .welcome-container p {
            font-size: 1.5rem;
            margin-bottom: 2.5rem;
            text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.2);
        }
        .welcome-container .btn {
            font-size: 1.25rem;
            padding: 12px 35px;
            border-radius: 50px;
            transition: transform 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
        }
        .welcome-container .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }
        .prompt {
            margin-top: 2rem;
            font-style: italic;
            color: #e0e0e0;
            font-size: 1rem;
        }
    </style>
</head>
<body>

    <div class="welcome-container">
        <h1>AceroJJ</h1>
        <p>Tu socio confiable en productos de acero.</p>
        <a href="login.html" class="btn btn-light btn-lg fw-bold">
            <i class="fas fa-sign-in-alt me-2"></i> Iniciar Sesión
        </a>
        <p class="prompt">o presiona 'Enter' para continuar</p>
    </div>

    <script>
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Enter') {
                // Prevenir cualquier acción por defecto del Enter
                event.preventDefault();
                // Redirigir a la página de login
                window.location.href = 'login.html';
            }
        });
    </script>

</body>
</html>
