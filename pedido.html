<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmar Pedido - Acero JJ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark">
            <div class="container-fluid">
                <a class="navbar-brand" href="index.html">
                    <img src="imagenes/logo jj.png" alt="Logo Acero JJ" style="height: 40px;">
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link" href="index.html">Inicio</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="productos.html">Productos</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="sobre-nosotros.html">Sobre Nosotros</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="contacto.html">Contacto</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="pedidos.html">Hacer Pedido</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="catalogo_nuevo.html">Catálogo</a>
                        </li>
                    </ul>
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="catalogo_nuevo.html">Volver al Catálogo de Productos</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="container mt-5">
        <section id="confirmar-pedido">
            <h2 class="text-center mb-4">Confirmar Pedido</h2>
            <div class="row">
                <div class="col-md-7">
                    <h4>Resumen del Pedido</h4>
                    <div id="order-summary"></div>
                    <h4 class="text-end mt-3">Total: <span id="order-total">$0.00</span> COP</h4>
                </div>
                <div class="col-md-5">
                    <h4>Información de Contacto</h4>
                    <form id="checkout-form">
                        <div class="mb-3">
                            <label for="name" class="form-label">Nombre Completo</label>
                            <input type="text" class="form-control" id="name" required>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">Correo Electrónico</label>
                            <input type="email" class="form-control" id="email" required>
                        </div>
                        <div class="mb-3">
                            <label for="phone" class="form-label">Teléfono</label>
                            <input type="tel" class="form-control" id="phone" required>
                        </div>
                        <div class="mb-3">
                            <label for="address" class="form-label">Dirección de Envío</label>
                            <textarea class="form-control" id="address" rows="3" required></textarea>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-success btn-lg">Confirmar Pedido</button>
                        </div>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <footer class="bg-dark text-white text-center p-3 mt-5">
        <p>&copy; 2025 Acero JJ. Todos los derechos reservados.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const orderSummary = document.getElementById('order-summary');
            const orderTotal = document.getElementById('order-total');
            const checkoutForm = document.getElementById('checkout-form');

            const cart = JSON.parse(localStorage.getItem('cart')) || [];

            function renderOrder() {
                if (cart.length === 0) {
                    orderSummary.innerHTML = '<p>No hay productos en tu pedido.</p>';
                    return;
                }

                const table = document.createElement('table');
                table.classList.add('table');
                table.innerHTML = `
                    <thead>
                        <tr>
                            <th>Producto</th>
                            <th>Precio</th>
                            <th>Cantidad</th>
                            <th>Subtotal</th>
                        </tr>
                    </thead>
                    <tbody>
                    </tbody>
                `;

                const tbody = table.querySelector('tbody');
                cart.forEach(item => {
                    const subtotal = item.price * item.quantity;
                    const productName = item.size ? `${item.name} (${item.size})` : item.name;
                    const row = `
                        <tr>
                            <td>${productName}</td>
                            <td>$${item.price.toLocaleString('es-CO')}</td>
                            <td>${item.quantity}</td>
                            <td>$${subtotal.toLocaleString('es-CO')}</td>
                        </tr>
                    `;
                    tbody.innerHTML += row;
                });

                orderSummary.appendChild(table);

                const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
                orderTotal.textContent = `$${total.toLocaleString('es-CO')}`;
            }

            checkoutForm.addEventListener('submit', e => {
                e.preventDefault();
                if (cart.length === 0) {
                    alert('Tu carrito está vacío.');
                    return;
                }
                
                const name = document.getElementById('name').value;
                alert(`¡Gracias por tu pedido, ${name}!\n\nTu pedido ha sido confirmado y será procesado a la brevedad.\n\nTotal: ${orderTotal.textContent} COP`);
                
                localStorage.removeItem('cart');
                window.location.href = 'catalogo_nuevo.html';
            });

            renderOrder();
        });
    </script>
</body>
</html>
